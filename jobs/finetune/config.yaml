# Fine-tuning settings (recorded in the repository, Guide 6.2). Change => new model version.
model_version: scorer-lora@v1
base_model: unsloth/Llama-3.2-1B-Instruct      # 1B; try Qwen2.5-1.5B-Instruct or Llama-3.2-3B as comparison
max_seq_length: 2048
load_in_4bit: true                              # QLoRA
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  epochs: 3
  learning_rate: 2.0e-4
  per_device_batch_size: 4
  gradient_accumulation: 4
  warmup_ratio: 0.05
  eval_every_steps: 20
  seed: 42
export:
  quantization: q4_k_m
  gguf_name: scorer-q4_k_m.gguf
