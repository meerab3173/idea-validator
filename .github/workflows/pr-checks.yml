name: pr-checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy libs/common/common services/verdict/src

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [verdict, tools, scouts, kb, analyst, scorer, critic, validators, ideation, orchestrator, agentops, profile, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: pytest ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: python -m pytest -q

  jobs-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q jobs/evaluation/tests jobs/finetune/tests

  retrieval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q eval/retrieval   # fails if recall@5 / MRR drop below eval/retrieval/baseline.json

  ui-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install
      - run: npm run lint
      - run: npm test

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas -skip Kustomization k8s/*.yaml
      - name: configmaps are up to date
        run: |
          pip install PyYAML==6.0.2
          python scripts/make_configmaps.py
          git diff --exit-code k8s/11-configmaps.generated.yaml

  docker:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, profile, orchestrator, scouts, tools, kb, analyst, ideation, validators, scorer, verdict, critic, agentops]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/${{ matrix.service }}/Dockerfile -t ${{ matrix.service }}:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: true

  docker-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ui:${{ github.sha }} services/ui
      - uses: aquasecurity/trivy-action@0.24.0
        with: { image-ref: "ui:${{ github.sha }}", exit-code: "1", severity: "CRITICAL", ignore-unfixed: true }
