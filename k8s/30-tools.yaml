apiVersion: apps/v1
kind: Deployment
metadata:
  name: tools
  namespace: idea-validator
  labels: &id001
    app: tools
    part-of: idea-validator
    egress: internet
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: tools
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: tools
        image: idea-validator/tools:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: PROFILE_URL
          value: http://profile:8000
        - name: SCOUTS_URL
          value: http://scouts:8000
        - name: LLM_UPSTREAM_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: LLM_UPSTREAM_KEY
              optional: true
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: GITHUB_TOKEN
              optional: true
        - name: REDDIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDDIT_TOKEN
              optional: true
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: tools
  namespace: idea-validator
spec:
  selector:
    app: tools
  ports:
  - port: 8000
    targetPort: 8000
