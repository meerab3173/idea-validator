# EXAMPLE ONLY — never commit real values. Create the real secret with:
#   kubectl -n idea-validator create secret generic app-secrets \
#     --from-literal=POSTGRES_PASSWORD=... --from-literal=JWT_SECRET=... \
#     --from-literal=LLM_UPSTREAM_KEY=... --from-literal=GITHUB_TOKEN=... --from-literal=EVAL_PASSWORD=...
apiVersion: v1
kind: Secret
metadata: { name: app-secrets, namespace: idea-validator }
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<set me>"
  JWT_SECRET: "<set me>"
  LLM_UPSTREAM_KEY: "<set me>"
  GITHUB_TOKEN: ""
  REDDIT_TOKEN: ""
  EVAL_PASSWORD: "<set me>"
