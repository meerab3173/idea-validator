apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: idea-validator
  labels: &id001
    app: orchestrator
    part-of: idea-validator
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: orchestrator
        image: idea-validator/orchestrator:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: PROFILE_URL
          value: http://profile:8000
        - name: SCOUTS_URL
          value: http://scouts:8000
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: budgets
          mountPath: /config
        - name: rubrics
          mountPath: /rubrics
      volumes:
      - name: budgets
        configMap:
          name: budgets-config
      - name: rubrics
        configMap:
          name: rubrics
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: idea-validator
spec:
  selector:
    app: orchestrator
  ports:
  - port: 8000
    targetPort: 8000
