apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: idea-validator
  labels: &id001
    app: ui
    part-of: idea-validator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: ui
        image: idea-validator/ui:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: API_URL
          value: /api
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: idea-validator
spec:
  selector:
    app: ui
  ports:
  - port: 80
    targetPort: 8080
