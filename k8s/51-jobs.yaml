apiVersion: batch/v1
kind: Job
metadata:
  name: ingest-snapshot
  namespace: idea-validator
spec:
  template:
    metadata:
      labels:
        app: job-scouts
        part-of: idea-validator
    spec:
      restartPolicy: OnFailure
      containers:
      - name: job
        image: idea-validator/scouts:dev
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - src.pipeline
        - --from-snapshot
        - /app/snapshot/cards.jsonl
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
        env:
        - name: RAW_DIR
          value: /tmp/raw
  backoffLimit: 2
