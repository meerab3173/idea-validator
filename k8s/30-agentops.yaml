apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops
  namespace: idea-validator
  labels: &id001
    app: agentops
    part-of: idea-validator
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: agentops
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: agentops
        image: idea-validator/agentops:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: PROFILE_URL
          value: http://profile:8000
        - name: SCOUTS_URL
          value: http://scouts:8000
        - name: TRACE_DIR
          value: /data/traces
        - name: EVAL_RESULTS
          value: /data/eval-results
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: traces
          mountPath: /data
      volumes:
      - name: traces
        persistentVolumeClaim:
          claimName: traces
---
apiVersion: v1
kind: Service
metadata:
  name: agentops
  namespace: idea-validator
spec:
  selector:
    app: agentops
  ports:
  - port: 8000
    targetPort: 8000
