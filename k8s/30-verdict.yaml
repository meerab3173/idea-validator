apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdict
  namespace: idea-validator
  labels: &id001
    app: verdict
    part-of: idea-validator
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: verdict
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: verdict
        image: idea-validator/verdict:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: PROFILE_URL
          value: http://profile:8000
        - name: SCOUTS_URL
          value: http://scouts:8000
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 300m
            memory: 192Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: verdict-config
          mountPath: /config
      volumes:
      - name: verdict-config
        configMap:
          name: verdict-config
---
apiVersion: v1
kind: Service
metadata:
  name: verdict
  namespace: idea-validator
spec:
  selector:
    app: verdict
  ports:
  - port: 8000
    targetPort: 8000
