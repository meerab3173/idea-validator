apiVersion: apps/v1
kind: Deployment
metadata:
  name: validators
  namespace: idea-validator
  labels: &id001
    app: validators
    part-of: idea-validator
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: validators
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: validators
        image: idea-validator/validators:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: PROFILE_URL
          value: http://profile:8000
        - name: SCOUTS_URL
          value: http://scouts:8000
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: validators
  namespace: idea-validator
spec:
  selector:
    app: validators
  ports:
  - port: 8000
    targetPort: 8000
