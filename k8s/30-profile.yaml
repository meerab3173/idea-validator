apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile
  namespace: idea-validator
  labels: &id001
    app: profile
    part-of: idea-validator
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: profile
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: profile
        image: idea-validator/profile:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: PROFILE_URL
          value: http://profile:8000
        - name: SCOUTS_URL
          value: http://scouts:8000
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_PASSWORD
        - name: DATABASE_URL
          value: postgresql://app:$(PGPASSWORD)@postgres:5432/ideas
        - name: KB_DATABASE_URL
          value: postgresql://app:$(PGPASSWORD)@postgres:5432/ideas
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: profile
  namespace: idea-validator
spec:
  selector:
    app: profile
  ports:
  - port: 8000
    targetPort: 8000
