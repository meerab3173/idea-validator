apiVersion: v1
kind: ConfigMap
metadata:
  name: rubrics
  namespace: idea-validator
data:
  REGISTRY.yaml: "# Prompt and rubric registry (M13). Every verdict records `set`.\n# Change any rubric => bump its version here AND in the file, bump `set`, re-run eval.\nset: r1\nrubrics:\n  demand_pain:\
    \ 1\n  competition: 1\n  differentiation: 1\n  feasibility: 1\n  risk: 1\n  learning: 1\nprompts:\n  scorer_system: 1\n  ideator: 1\n  gap_analyst: 1\n  skeptic: 1\n  critic: 1\n"
  competition.yaml: "dimension: competition\nversion: 1\nscale: 0-5\nquestion: \"How much room is there to enter, given direct competitors in the knowledge base?\"\nanchors:\n  5: \"No direct competitor\
    \ in the knowledge base for this user and problem.\"\n  4: \"One or two small or inactive competitors (no funding, few stars, no recent launches).\"\n  3: \"A few active competitors but none dominant;\
    \ a niche is open.\"\n  2: \"Several active, funded competitors; entry needs a clear angle.\"\n  1: \"A dominant product plus many clones.\"\n  0: \"Saturated niche: many funded competitors and falling\
    \ launches.\"\nfeatures: [n_direct_competitors, competitor_funding_usd, niche_saturation, niche_trend_slope]\noutput_schema: [score, confidence, evidence_ids, reason]\nrules:\n  - \"A competitor must\
    \ be a card in the knowledge base; name it by card id.\"\nexamples:\n  - { level: 5, input: \"Urdu speech-to-notes for lectures; no matching cards\", expected: { score: 5 } }\n  - { level: 4, input:\
    \ \"Lab-viva question bank; 2 small GitHub repos, inactive\", expected: { score: 4 } }\n  - { level: 3, input: \"Hackathon team matcher; 4 small active tools\", expected: { score: 3 } }\n  - { level:\
    \ 2, input: \"Habit tracker for students; 8 active apps, 2 funded\", expected: { score: 2 } }\n  - { level: 1, input: \"Notes app; Notion dominant plus many clones\", expected: { score: 1 } }\n  - {\
    \ level: 0, input: \"Generic AI chat wrapper; saturated, falling launches\", expected: { score: 0 } }\n"
  demand_pain.yaml: "dimension: demand_pain\nversion: 1\nscale: 0-5        # higher is better for the student\nquestion: \"How strong and widespread is the problem this idea solves?\"\nanchors:\n  5: \"\
    Five or more independent sources on 2+ platforms describe the same recurring problem, with growth in the last 6 months.\"\n  4: \"Four or more sources on 2+ platforms, problem clearly recurring, flat\
    \ or slightly rising.\"\n  3: \"Two or three sources show the problem, no clear growth.\"\n  2: \"Two weak mentions, or several mentions on one platform only.\"\n  1: \"A single weak or old (more than\
    \ 18 months) mention.\"\n  0: \"No evidence of the problem.\"\nfeatures: [n_sources, n_platforms, complaint_count, trend_growth]\noutput_schema: [score, confidence, evidence_ids, reason]\nrules:\n \
    \ - \"Cite only evidence ids that appear in the EVIDENCE block.\"\n  - \"If no evidence supports a score, reply {\\\"abstain\\\": true}.\"\nexamples:\n  - { level: 5, input: \"Study planner for exam\
    \ season; 6 HN/Reddit threads complaining about scattered deadlines, rising mentions\", expected: { score: 5, evidence_ids: [\"card_a#c0\", \"card_b#c1\"] } }\n  - { level: 4, input: \"Invoice tool\
    \ for freelancers; 4 sources across reddit and HN\", expected: { score: 4 } }\n  - { level: 3, input: \"Recipe scaler; 2 reddit threads and one HN comment\", expected: { score: 3 } }\n  - { level: 2,\
    \ input: \"Plant-watering reminders; 2 posts in one subreddit\", expected: { score: 2 } }\n  - { level: 1, input: \"Fax-to-email bridge; one 2019 comment\", expected: { score: 1 } }\n  - { level: 0,\
    \ input: \"Idea with no matching evidence\", expected: { abstain: true } }\n"
  differentiation.yaml: "dimension: differentiation\nversion: 1\nscale: 0-5\nquestion: \"Is there a clear gap that existing products do not address?\"\nanchors:\n  5: \"A specific, evidenced gap (missing\
    \ feature or unserved user) that no card covers.\"\n  4: \"A clear gap partly covered by one product.\"\n  3: \"A distinct angle (user segment, locale, price) with some evidence.\"\n  2: \"Small improvements\
    \ on existing products.\"\n  1: \"Cosmetic differences only.\"\n  0: \"A renamed copy of an existing product.\"\nfeatures: [gap_matches, complaint_overlap_with_competitors, unique_feature_count]\noutput_schema:\
    \ [score, confidence, evidence_ids, reason]\nexamples:\n  - { level: 5, input: \"Offline-first attendance for low-connectivity campuses; complaints cite outages, no competitor offline\", expected: {\
    \ score: 5 } }\n  - { level: 4, input: \"Invoice tool with PKR tax rules; one competitor has partial support\", expected: { score: 4 } }\n  - { level: 3, input: \"Recipe app focused on hostel students'\
    \ budgets\", expected: { score: 3 } }\n  - { level: 2, input: \"Todo app with slightly nicer UI\", expected: { score: 2 } }\n  - { level: 1, input: \"Same todo app in a different colour\", expected:\
    \ { score: 1 } }\n  - { level: 0, input: \"Clone of Trello with a new name\", expected: { score: 0 } }\n"
  feasibility.yaml: "dimension: feasibility\nversion: 1\nscale: 0-5\nquestion: \"Can THIS student build it with their hours, skills and compute, with margin?\"\nanchors:\n  5: \"Estimated effort under 50%\
    \ of available hours; all core skills present; laptop compute is enough.\"\n  4: \"Effort 50-70% of hours; one minor new skill.\"\n  3: \"Effort 70-90% of hours, or one major new skill.\"\n  2: \"Effort\
    \ 90-100% of hours, or two major new skills, or needs GPU they lack.\"\n  1: \"Effort slightly above hours (gate may still pass with scope cuts).\"\n  0: \"Clearly impossible for this team in this time.\"\
    \nfeatures: [estimated_hours, available_hours, hours_ratio, skill_overlap, compute_need]\noutput_schema: [score, confidence, evidence_ids, reason]\nexamples:\n  - { level: 5, input: \"CRUD web app,\
    \ team knows React+Postgres, 240 h available, ~90 h estimate\", expected: { score: 5 } }\n  - { level: 4, input: \"Same app plus a simple ML model they have not used\", expected: { score: 4 } }\n  -\
    \ { level: 3, input: \"Mobile app in Flutter, nobody knows Flutter\", expected: { score: 3 } }\n  - { level: 2, input: \"Real-time multiplayer game, needs GPU training\", expected: { score: 2 } }\n\
    \  - { level: 1, input: \"Full marketplace with payments, 260 h vs 240 h\", expected: { score: 1 } }\n  - { level: 0, input: \"Self-driving robot, solo, 20 h\", expected: { score: 0 } }\n"
  learning.yaml: "dimension: learning\nversion: 1\nscale: 0-5\nquestion: \"Does it teach skills the student wants and show well on a CV?\"\nanchors:\n  5: \"Uses 2+ skills from the student's interests/wanted\
    \ list, deployable demo, strong CV story.\"\n  4: \"One wanted skill plus a deployable demo.\"\n  3: \"Mostly known skills, but a complete, demoable product.\"\n  2: \"Little new learning, weak demo.\"\
    \n  1: \"Tutorial-level project.\"\n  0: \"Nothing new, nothing to show.\"\nfeatures: [wanted_skill_overlap, demo_ready, novelty]\noutput_schema: [score, confidence, evidence_ids, reason]\nexamples:\n\
    \  - { level: 5, input: \"RAG + Kubernetes deployed product for a student who wants MLOps\", expected: { score: 5 } }\n  - { level: 4, input: \"React Native app for a student wanting mobile\", expected:\
    \ { score: 4 } }\n  - { level: 3, input: \"Full-stack CRUD app the team already knows how to build\", expected: { score: 3 } }\n  - { level: 2, input: \"Static landing page\", expected: { score: 2 }\
    \ }\n  - { level: 1, input: \"Todo list from a tutorial\", expected: { score: 1 } }\n  - { level: 0, input: \"Copy of an existing repo\", expected: { score: 0 } }\n"
  risk.yaml: "dimension: risk\nversion: 1\nscale: 0-5        # 5 = NO concern (higher is better)\nquestion: \"Legal, privacy, safety or platform-dependency concerns?\"\nanchors:\n  5: \"No personal data,\
    \ no regulated domain, no single-platform dependency.\"\n  4: \"Minor personal data (emails) with standard protection.\"\n  3: \"Depends on one third-party API that could change terms, or moderate personal\
    \ data.\"\n  2: \"Sensitive data (health, finance, minors) needing consent and compliance work.\"\n  1: \"Scraping against terms, or heavy dependency on an API that bans this use.\"\n  0: \"Clear legal\
    \ or safety blocker (illegal, dangerous, violates platform terms).\"\nfeatures: [handles_personal_data, regulated_domain, platform_dependency, blockers]\noutput_schema: [score, confidence, evidence_ids,\
    \ reason]\nexamples:\n  - { level: 5, input: \"Offline unit converter\", expected: { score: 5 } }\n  - { level: 4, input: \"Study planner with email login\", expected: { score: 4 } }\n  - { level: 3,\
    \ input: \"Tool built on the Reddit API\", expected: { score: 3 } }\n  - { level: 2, input: \"Mental-health journaling app for teenagers\", expected: { score: 2 } }\n  - { level: 1, input: \"LinkedIn\
    \ profile scraper\", expected: { score: 1 } }\n  - { level: 0, input: \"App that bypasses paywalls\", expected: { score: 0 } }\n"
