data:
  verdict.yaml: "# Verdict Engine rules (M11). Mounted into the verdict pod as a ConfigMap\n# (k8s/config/verdict-config.yaml is generated from this file by\n# scripts/make_configmaps.sh). Change a value\
    \ => bump `version` and re-run eval.\nversion: w1\nengine_version: m11@v1\n\n# Weights per goal. Each row must add to 100 (unit-tested).\nweights:\n  startup:        { demand_pain: 25, competition:\
    \ 20, differentiation: 20, feasibility: 15, risk: 15, learning: 5 }\n  portfolio:      { demand_pain: 15, competition: 15, differentiation: 15, feasibility: 25, risk: 10, learning: 20 }\n  course_project:\
    \ { demand_pain: 10, competition: 10, differentiation: 15, feasibility: 35, risk: 10, learning: 20 }\n\nthresholds:\n  T_go: 70\n  T_no: 50\n  floor: 1.5\n\nconfidence:\n  min: 0.5              # below\
    \ => INSUFFICIENT_EVIDENCE\n  w_mean_conf: 0.7\n  w_sources: 0.3\n  sources_for_full: 5\n\ngates:\n  evidence_min_sources: 3\n  evidence_min_platforms: 2\n  duplicate_differentiation_override: 3\n\n\
    sensitivity:\n  weight_delta: 0.20    # +/- 20 %\n  score_delta: 1.0      # least confident score +/- 1\n\nchallenge:\n  score_penalty: 0.5\n  max_penalty: 1.0\n  confidence_penalty: 0.1\n\nwhatif:\n\
    \  step: 0.5\n"
