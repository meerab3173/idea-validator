# Verdict Engine rules (M11). Mounted into the verdict pod as a ConfigMap
# (k8s/config/verdict-config.yaml is generated from this file by
# scripts/make_configmaps.sh). Change a value => bump `version` and re-run eval.
version: w1
engine_version: m11@v1

# Weights per goal. Each row must add to 100 (unit-tested).
weights:
  startup:        { demand_pain: 25, competition: 20, differentiation: 20, feasibility: 15, risk: 15, learning: 5 }
  portfolio:      { demand_pain: 15, competition: 15, differentiation: 15, feasibility: 25, risk: 10, learning: 20 }
  course_project: { demand_pain: 10, competition: 10, differentiation: 15, feasibility: 35, risk: 10, learning: 20 }

thresholds:
  T_go: 70
  T_no: 50
  floor: 1.5

confidence:
  min: 0.5              # below => INSUFFICIENT_EVIDENCE
  w_mean_conf: 0.7
  w_sources: 0.3
  sources_for_full: 5

gates:
  evidence_min_sources: 3
  evidence_min_platforms: 2
  duplicate_differentiation_override: 3

sensitivity:
  weight_delta: 0.20    # +/- 20 %
  score_delta: 1.0      # least confident score +/- 1

challenge:
  score_penalty: 0.5
  max_penalty: 1.0
  confidence_penalty: 0.1

whatif:
  step: 0.5
